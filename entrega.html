<style>
:root{color-scheme:dark;--bg:#04111e;--card:#0b2234;--line:#1f4b66;--cyan:#27def6;--txt:#eef8ff;--muted:#9fbfd2;--ok:#2fd39a;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#0b3554 0%,#04111e 55%);color:var(--txt);min-height:100vh}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:14px clamp(14px,3vw,34px);border-bottom:1px solid #18394f;background:#04101cd0}
header h1{margin:0;font-size:18px;letter-spacing:-.02em}header h1 b{color:var(--cyan)}
.priv{font-size:12px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
main{max-width:1180px;margin:0 auto;padding:18px clamp(12px,2.5vw,28px) 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:linear-gradient(160deg,#0d2a40,#081a2b);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
h2{margin:0 0 10px;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:#7fe9ff}
label{display:block;font-size:12px;font-weight:800;color:#b5d4e5;margin:12px 0 5px}
input,textarea{width:100%;font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid #2f6f90;background:#04101c;color:#fff;outline:none}
input:focus,textarea:focus{border-color:#45e7ff;box-shadow:0 0 0 3px #45e7ff2a}
textarea{resize:vertical}
#cola{min-height:96px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.linha{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.campo{position:relative}.campo .aviso{position:absolute;right:10px;top:38px;font-size:11px;color:#ffd27a}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:96px;font:inherit;font-weight:850;padding:10px;border-radius:10px;border:1px solid #2a6a8c;background:#0b2a3e;color:#cfeeff;cursor:pointer}
.seg button[aria-pressed=true]{background:linear-gradient(90deg,#20d3f0,#14a8e0);border-color:#5feaff;color:#02202e}
.prev{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
@media(max-width:520px){.prev{grid-template-columns:1fr}}
.prev img{width:100%;border-radius:10px;border:1px solid #2a6a8c}
#texto{min-height:300px;font-size:13px;line-height:1.45}
.refaz{font:inherit;font-size:12px;background:none;border:0;color:#7fe9ff;cursor:pointer;padding:4px 0;text-decoration:underline}
.passos{display:grid;gap:9px;margin-top:4px}
.passo{display:flex;align-items:center;gap:12px;width:100%;font:inherit;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid #2a6a8c;background:#0b2a3e;color:#eaf7ff;cursor:pointer}
.passo:disabled{opacity:.45;cursor:not-allowed}
.passo .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#123d57;font-weight:900;flex-shrink:0}
.passo strong{display:block;font-size:15px}.passo small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.passo.principal{border-color:#5feaff;background:linear-gradient(90deg,#0f4a63,#0b2a3e)}
.passo.feito{border-color:var(--ok)}.passo.feito .n{background:var(--ok);color:#03251a}
.rodape{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
#limpar{white-space:nowrap;font:inherit;font-weight:800;padding:9px 14px;border-radius:10px;border:1px solid #6b3b3b;background:#2a1212;color:#ffc9c9;cursor:pointer}
#status{min-height:20px;font-size:13px;color:#a6f3d0}
#status.erro{color:#ffb3b3}
.busca{position:relative}
#sugestoes{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:20;background:#061827;border:1px solid #2f6f90;border-radius:12px;max-height:330px;overflow:auto;box-shadow:0 18px 40px #000a}
#sugestoes button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:14px;padding:7px 10px;border:0;border-bottom:1px solid #12324a;background:none;color:#eaf7ff;cursor:pointer}
#sugestoes button:hover,#sugestoes button.ativo{background:#0f3a54}
#sugestoes img{width:34px;height:42px;object-fit:cover;border-radius:5px;background:#0b2a3e;flex-shrink:0}
#sugestoes small{display:block;color:#8fb3c8;font-size:11px}
.capaLinha{display:flex;align-items:center;gap:12px;margin-top:10px}
.capaLinha img{width:54px;height:68px;object-fit:cover;border-radius:7px;border:1px solid #2a6a8c;background:#0b2a3e}
.capaLinha .info{flex:1;font-size:12px;color:#9fbfd2}.capaLinha .info b{display:block;color:#eaf7ff;font-size:13px}
.btnP{font:inherit;font-size:12px;font-weight:800;padding:8px 11px;border-radius:9px;border:1px solid #2a6a8c;background:#0b2a3e;color:#cfeeff;cursor:pointer;white-space:nowrap}
.prev{grid-template-columns:190px minmax(0,1fr)}
@media(max-width:520px){.prev{grid-template-columns:minmax(0,1fr)}.prev img{max-width:260px}.linha{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header><h1>🎁 Entregar jogo · <b>MCO GAMES</b></h1><span class="priv">🔒 E-mail e senha ficam só neste aparelho: nada é enviado nem salvo. <span id="catStatus">Carregando catálogo…</span></span></header>
<main>
<section class="card" aria-labelledby="t1">
  <h2 id="t1">1. Dados da venda</h2>
  <label for="cola">Cole aqui os dados da conta (TXT, NEXUS, qualquer formato)</label>
  <textarea id="cola" placeholder="EMAIL: fulano@exemplo.com&#10;SENHA: ********&#10;(a página acha o e-mail e a senha sozinha)"></textarea>
  <div class="linha">
    <div class="campo"><label for="email">E-mail da conta</label><input id="email" type="text" autocomplete="off" spellcheck="false"><span class="aviso" id="avEmail"></span></div>
    <div class="campo"><label for="senha">Senha da conta</label><input id="senha" type="text" autocomplete="off" spellcheck="false"><span class="aviso" id="avSenha"></span></div>
  </div>
  <label for="jogo">Jogo (busca no catálogo da loja)</label>
  <div class="busca"><input id="jogo" type="text" autocomplete="off" placeholder="Digite: GTA, Elden, FC 27…" role="combobox" aria-expanded="false" aria-controls="sugestoes"><div id="sugestoes" role="listbox" hidden></div></div>
  <div class="capaLinha"><img id="capaMini" alt=""><div class="info"><b id="capaTit">Sem capa</b><span id="capaSub">Escolha o jogo da lista ou use uma imagem sua. Sem capa, vai a arte padrão.</span></div>
    <label class="btnP" for="capaArq" style="margin:0">🖼️ Trocar capa</label><input id="capaArq" type="file" accept="image/*" hidden></div>
  <label>Console</label>
  <div class="seg" role="group" aria-label="Console"><button type="button" data-console="PS4" aria-pressed="false">PS4</button><button type="button" data-console="PS5" aria-pressed="true">PS5</button></div>
  <label>Vaga</label>
  <div class="seg" role="group" aria-label="Vaga"><button type="button" data-vaga="primaria" aria-pressed="true">Primária</button><button type="button" data-vaga="secundaria" aria-pressed="false">Secundária</button></div>
</section>

<section class="card" aria-labelledby="t2">
  <h2 id="t2">2. Mensagem para o cliente</h2>
  <div class="prev">
    <img id="arteMini" alt="Arte que vai para o cliente">
    <div><textarea id="texto" aria-label="Texto da mensagem"></textarea>
    <button type="button" class="refaz" id="refazer" hidden>↺ refazer o texto com os dados atuais</button></div>
  </div>
  <h2 style="margin-top:16px">3. Enviar no WhatsApp</h2>
  <div class="passos">
    <button type="button" class="passo principal" id="compartilhar"><span class="n">1</span><span><strong>📤 Compartilhar arte + texto</strong><small id="dica1">Baixa a arte e copia o texto. No WhatsApp: arraste a arte para a conversa, cole o texto (Ctrl+V) e envie.</small></span></button>
    <button type="button" class="passo" id="copEmail"><span class="n">2</span><span><strong>📧 Copiar e-mail</strong><small>Cole na conversa e envie (sozinho, para o cliente copiar fácil).</small></span></button>
    <button type="button" class="passo" id="copSenha"><span class="n">3</span><span><strong>🔑 Copiar senha</strong><small>Cole na conversa e envie.</small></span></button>
  </div>
  <div class="rodape"><div id="status" role="status" aria-live="polite"></div><button type="button" id="limpar">🧹 Limpar (próxima entrega)</button></div>
</section>
</main>

/* ================= CATÁLOGO DA LOJA (mesmas abas publicadas que o site usa) ================= */
const CSV_BASE='https://docs.google.com/spreadsheets/d/e/2PACX-1vTbnddE66aBmhilS8BtFkch5qx41mzkZOiVtVeMxzHJRXljT3qevVZFGf4jU8o1LNZHuHL_3bnIGqRg/pub?output=csv&gid=';
const ABAS=[{gid:'307634723',nome:'Lançamento em Oferta'},{gid:'0',nome:'Pré-venda'},{gid:'903469329',nome:'Promoção'},{gid:'212181136',nome:'Catálogo'}];
const norm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[™®©]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function lerCSV(txt){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(c!=='\r')cell+=c;}
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}
const catalogo=[];
function montarCatalogo(tabelas){
  const mapa=new Map();
  tabelas.forEach(({aba,rows})=>{
    if(!rows||rows.length<2)return;
    const cab=rows[0].map(norm);
    const col=(fb,...nomes)=>{for(const n of nomes){const i=cab.indexOf(norm(n));if(i>=0)return i;}return fb;};
    const C={nome:col(1,'Jogo','Nome'),capa:col(12,'Capa','Imagem','URL Capa'),p5a:col(3,'PS5 Primária'),p5b:col(5,'PS5 Secundária'),p4a:col(7,'PS4 Primária'),p4b:col(9,'PS4 Secundária'),capasCombo:col(16,'Capas do Combo','Capas Combo')};
    const num=v=>{let t=String(v||'').replace(/[R$\s]/g,'');if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');const n=Number(t);return isFinite(n)?n:0;};
    rows.slice(1).forEach(r=>{
      const nome=String(r[C.nome]||'').trim();if(!nome)return;
      const capaCombo=String(r[C.capasCombo]||'').split(/[\s|,;]+/).find(u=>/^https?:\/\//i.test(u))||'';
      const capa=capaCombo||(/^https?:\/\//i.test(String(r[C.capa]||'').trim())?String(r[C.capa]).trim():'');
      const plats=[];if(num(r[C.p4a])>0||num(r[C.p4b])>0)plats.push('PS4');if(num(r[C.p5a])>0||num(r[C.p5b])>0)plats.push('PS5');
      const k=norm(nome);const ja=mapa.get(k);
      if(ja){if(!ja.capa&&capa)ja.capa=capa;plats.forEach(x=>{if(!ja.plats.includes(x))ja.plats.push(x);});if(!ja.abas.includes(aba))ja.abas.push(aba);}
      else mapa.set(k,{nome,capa,plats,abas:[aba],k,sigla:k.split(' ').map(w=>/^\d+$/.test(w)?w:w[0]).join('')});
    });
  });
  catalogo.length=0;mapa.forEach(v=>{v.plats.sort();catalogo.push(v);});catalogo.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}
async function carregarCatalogo(){
  const tabelas=await Promise.all(ABAS.map(async a=>{
    try{const r=await fetch(CSV_BASE+a.gid+'&cb='+Date.now(),{credentials:'omit',cache:'no-store'});if(!r.ok)throw 0;return {aba:a.nome,rows:lerCSV(await r.text())};}
    catch(_){return {aba:a.nome,rows:null};}
  }));
  montarCatalogo(tabelas);
  const falhas=tabelas.filter(t=>!t.rows).length;
  $('catStatus').textContent=catalogo.length?('· Catálogo: '+catalogo.length+' jogos'+(falhas?' ('+falhas+' aba(s) não carregaram)':'')):'· Catálogo indisponível: digite o nome e use “Trocar capa”.';
  const j=$('jogo').value.trim();if(j&&!capa.img)casarAutomatico(j);
}
const GENERICAS=new Set(['standard','edition','edicao','padrao','deluxe','digital','ps4','ps5','de','do','da','the','e','jogo','game','versao','comprado']);
function buscar(q,solto){
  const n=norm(q);if(!n)return [];
  let ps=n.split(' ');
  if(solto){const f=ps.filter(p=>!GENERICAS.has(p));if(f.length)ps=f;}
  const junto=n.replace(/ /g,'');
  // Palavras soltas ("elden") ou sigla ("gta" → Grand Theft Auto, "gtav", "rdr2").
  const casa=g=>ps.every(p=>g.k.includes(p))||(junto.length>=2&&g.sigla.startsWith(junto));
  return catalogo.filter(casa)
    .sort((a,b)=>(b.k.startsWith(n)-a.k.startsWith(n))||(a.k.length-b.k.length)).slice(0,8);
}
function casarAutomatico(nome){
  if(!catalogo.length)return;
  const n=norm(nome);const g=catalogo.find(x=>x.k===n);
  if(g){escolherJogo(g,true);return;}
  const cand=buscar(nome,true);
  if(cand.length===1){escolherJogo(cand[0],true);status('Capa de “'+cand[0].nome+'” (nome parecido no catálogo). Confira.');return;}
  if(cand.length>1){$('jogo').value=nome;sugs=cand;mostrarLista(cand);status('Achei mais de um jogo parecido: escolha na lista para puxar a capa.');return;}
  status('“'+nome+'” não está no catálogo da loja: use “🖼️ Trocar capa” para pôr a capa.',true);
}

/* ---------- sugestões da busca ---------- */
let sugs=[],ativo=-1;
function mostrarSugestoes(){
  const lista=buscar($('jogo').value);
  if(!lista.length||document.activeElement!==$('jogo')){fecharSugestoes();return;}
  mostrarLista(lista);
}
function mostrarLista(lista){
  const box=$('sugestoes');sugs=lista;ativo=-1;
  box.innerHTML='';
  sugs.forEach((g,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','option');
    const im=document.createElement('img');im.alt='';im.loading='lazy';if(g.capa)im.src=g.capa;
    const sp=document.createElement('span');sp.textContent=g.nome;const sm=document.createElement('small');sm.textContent=(g.plats.join(' / ')||'—')+' · '+g.abas.join(', ');sp.appendChild(sm);
    b.append(im,sp);b.onmousedown=e=>{e.preventDefault();escolherJogo(g);};box.appendChild(b);});
  box.hidden=false;$('jogo').setAttribute('aria-expanded','true');
}
function fecharSugestoes(){$('sugestoes').hidden=true;$('jogo').setAttribute('aria-expanded','false');}
$('jogo').addEventListener('keydown',e=>{
  if($('sugestoes').hidden)return;
  const bs=[...$('sugestoes').querySelectorAll('button')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();ativo=(ativo+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('ativo',i===ativo));}
  else if(e.key==='Enter'&&ativo>=0){e.preventDefault();escolherJogo(sugs[ativo]);}
  else if(e.key==='Escape')fecharSugestoes();
});
$('jogo').addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==$('jogo'))fecharSugestoes();},120));
$('jogo').addEventListener('focus',()=>mostrarSugestoes());

/* ---------- capa ---------- */
const capa={img:null,fonte:'',nome:'',url:''};
let pedidoCapa=0;
async function bitmapDe(blob){if(!blob||!/^image\//.test(blob.type))throw Error('não é imagem');return await createImageBitmap(blob);}
async function carregarCapaUrl(url){
  try{const r=await fetch('https://images.weserv.nl/?url='+encodeURIComponent(url)+'&w=900&output=jpg',{mode:'cors',credentials:'omit'});if(!r.ok)throw 0;return await bitmapDe(await r.blob());}
  catch(_){const r=await fetch(url,{mode:'cors',credentials:'omit'});if(!r.ok)throw Error('capa');return await bitmapDe(await r.blob());}
}
function mostrarCapa(){
  $('capaMini').src=capa.url||'';$('capaMini').style.visibility=capa.img?'visible':'hidden';
  $('capaTit').textContent=capa.img?(capa.fonte==='arquivo'?'Capa: sua imagem':'Capa: '+capa.nome):'Sem capa';
  $('capaSub').textContent=capa.img?'A arte vai com esta capa.':'Escolha o jogo da lista ou use uma imagem sua. Sem capa, vai a arte padrão.';
}
async function escolherJogo(g,silencioso){
  fecharSugestoes();
  $('jogo').value=g.nome;
  atualizar();
  if(!g.capa){if(!silencioso)status('Esse jogo não tem capa no catálogo: use “Trocar capa”.',true);return;}
  const meu=++pedidoCapa;$('capaTit').textContent='Carregando capa…';
  try{const bm=await carregarCapaUrl(g.capa);if(meu!==pedidoCapa)return;
    capa.img=bm;capa.fonte='catalogo';capa.nome=g.nome;capa.url=g.capa;mostrarCapa();redesenhar();if(!silencioso)status('');}
  catch(_){if(meu!==pedidoCapa)return;capa.img=null;capa.url='';mostrarCapa();redesenhar();status('Não consegui carregar a capa desse jogo: use “Trocar capa”.',true);}
}

/* ================= ARTE (layout C: capa ao lado) ================= */
const W=1080,H=1200;let logoImg=null;
function carregarLogo(){return logoImg?Promise.resolve(logoImg):new Promise(r=>{const i=new Image();i.onload=()=>{logoImg=i;r(i);};i.onerror=()=>r(null);i.src=LOGO_SRC;});}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const FONTE='Inter, "Segoe UI", Arial, sans-serif';
function quebrar(c,tokens,largura){
  // tokens: [{t,cor}] (palavras). Devolve linhas de tokens.
  const linhas=[];let atual=[],w=0;const esp=c.measureText(' ').width;
  tokens.forEach(tk=>{const tw=c.measureText(tk.t).width;
    if(atual.length&&w+esp+tw>largura){linhas.push(atual);atual=[];w=0;}
    atual.push(tk);w+=(atual.length>1?esp:0)+tw;});
  if(atual.length)linhas.push(atual);return linhas;
}
async function desenharArte(){
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  const g=c.createRadialGradient(330,520,40,330,520,980);g.addColorStop(0,'#0b3958');g.addColorStop(1,'#040d1a');c.fillStyle=g;c.fillRect(0,0,W,H);
  // símbolos discretos
  c.save();c.globalAlpha=.18;c.strokeStyle='#27def6';c.lineWidth=5;c.beginPath();c.moveTo(985,70);c.lineTo(1035,150);c.lineTo(935,150);c.closePath();c.stroke();
  c.strokeRect(990,1090,52,52);c.beginPath();c.moveTo(40,1090);c.lineTo(90,1140);c.moveTo(90,1090);c.lineTo(40,1140);c.stroke();c.restore();
  const lg=await carregarLogo();
  if(lg){const lw=300,lh=lw*lg.naturalHeight/lg.naturalWidth;c.save();c.shadowColor='#2ee6ff88';c.shadowBlur=18;c.drawImage(lg,(W-lw)/2,30,lw,lh);c.restore();}
  // cartão da capa (inclinado)
  const cw=430,ch=580,cx=46+cw/2,cy=225+ch/2;
  c.save();c.translate(cx,cy);c.rotate(-4*Math.PI/180);
  c.save();c.shadowColor='#27def6';c.shadowBlur=45;rr(c,-cw/2,-ch/2,cw,ch,22);c.fillStyle='#0b2a3e';c.fill();c.restore();
  c.save();rr(c,-cw/2,-ch/2,cw,ch,22);c.clip();
  const im=capa.img;const s=Math.max(cw/im.width,ch/im.height),dw=im.width*s,dh=im.height*s;c.drawImage(im,-dw/2,-dh/2,dw,dh);c.restore();
  rr(c,-cw/2,-ch/2,cw,ch,22);c.lineWidth=4;c.strokeStyle='#45e7ff';c.stroke();c.restore();
  // coluna da direita
  const X=520,LARG=W-X-40;let y=245;
  c.save();c.beginPath();c.arc(X+34,y+34,31,0,Math.PI*2);c.lineWidth=5;c.strokeStyle='#27def6';c.shadowColor='#27def6';c.shadowBlur=18;c.stroke();
  c.beginPath();c.moveTo(X+20,y+35);c.lineTo(X+30,y+46);c.lineTo(X+49,y+24);c.lineWidth=6;c.lineCap='round';c.lineJoin='round';c.stroke();c.restore();
  const yCheck=y;
  const nome=($('jogo').value.trim()||'seu jogo');
  const tokens='Parabéns pela compra do seu'.split(' ').map(t=>({t,cor:'#ffffff'})).concat(nome.split(/\s+/).map(t=>({t,cor:'#45e7ff'})));
  tokens[tokens.length-1]={t:tokens[tokens.length-1].t+'!',cor:'#45e7ff'};
  let f=64,linhas;
  for(;f>=34;f-=4){c.font='900 '+f+'px '+FONTE;linhas=quebrar(c,tokens,LARG);if(linhas.length<=5&&tokens.every(tk=>c.measureText(tk.t).width<=LARG))break;}
  c.textBaseline='alphabetic';const lh=Math.round(f*1.08);
  y=yCheck+68+22+Math.round(f*0.80);
  linhas.forEach(l=>{let x=X;const esp=c.measureText(' ').width;l.forEach(tk=>{c.fillStyle=tk.cor;if(tk.cor!=='#ffffff'){c.save();c.shadowColor='#19deef88';c.shadowBlur=24;c.fillText(tk.t,x,y);c.restore();}else c.fillText(tk.t,x,y);x+=c.measureText(tk.t).width+esp;});y+=lh;});
  // etiqueta da vaga
  y+=10;const sel='CONTA '+(estado.vaga==='primaria'?'PRIMÁRIA':'SECUNDÁRIA')+' · '+estado.console;
  c.font='900 25px '+FONTE;try{c.letterSpacing='2px';}catch(_){}
  const sw=c.measureText(sel).width+48;c.save();rr(c,X,y,sw,54,27);c.fillStyle='#0b2a3e';c.fill();c.lineWidth=2.5;c.strokeStyle='#27def6';c.shadowColor='#27def680';c.shadowBlur=18;c.stroke();c.restore();
  c.fillStyle='#bff6ff';c.fillText(sel,X+24,y+36);try{c.letterSpacing='0px';}catch(_){}
  y+=54+52;
  c.font='500 27px '+FONTE;c.fillStyle='#cfe9f7';
  quebrar(c,'Seu jogo já está disponível. Siga o tutorial, libere o acesso e divirta-se!'.split(' ').map(t=>({t})),LARG).forEach(l=>{c.fillText(l.map(x=>x.t).join(' '),X,y);y+=38;});
  // faixa de selos
  const by=900;c.save();rr(c,46,by,W-92,96,22);c.fillStyle='rgba(6,24,42,.82)';c.fill();c.lineWidth=2;c.strokeStyle='rgba(39,222,246,.65)';c.stroke();c.restore();
  c.font='800 27px '+FONTE;c.fillStyle='#dff6ff';c.textAlign='center';
  ['✔ Jogo original','✔ Suporte especializado','✔ Passo a passo'].forEach((t,i)=>c.fillText(t,46+(W-92)*(i*2+1)/6,by+58));
  c.font='500 26px '+FONTE;c.fillStyle='#cfe9f7';c.fillText('Qualquer dúvida, conte com o nosso suporte!',W/2,1112);
  c.textAlign='left';
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));
}
let arteGerada=null,arteUrl='',desenhoPend=null,tDesenho=0;
function redesenhar(){
  clearTimeout(tDesenho);
  if(!capa.img){arteGerada=null;if(arteUrl){URL.revokeObjectURL(arteUrl);arteUrl='';}$('arteMini').src=URL.createObjectURL(arte());return Promise.resolve();}

async function arteParaEnviar(){if(capa.img){if(!arteGerada||desenhoPend)await (desenhoPend||redesenhar());if(arteGerada)return arteGerada;}return arte();}

/* ---------- leitura do que foi colado ---------- */
const RE_EMAIL=/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/;
function lerColado(txt){
  const out={email:'',senha:'',jogo:'',console:'',senhaIncerta:false};
  let linhas=String(txt||'').replace(/\r/g,'').split('\n');
  // Só a zona da conta: para na conta-mestre (ela tem e-mail e senha próprios).
  const corte=linhas.findIndex(l=>/^\s*(\[MESTRE\]|CONTA\s+MESTRE)/i.test(l));
  if(corte>=0)linhas=linhas.slice(0,corte);
  let iEmail=-1;
  linhas.forEach((l,i)=>{
    const s=l.trim();if(!s)return;
    let m;
    if(!out.email&&(m=s.match(/^(?:e-?mail|login|usu[aá]rio|id de in[ií]cio de sess[aã]o)\s*[:\-–]\s*(\S+@\S+)/i))){out.email=m[1];iEmail=i;return;}
    if(!out.senha&&(m=s.match(/^senha(?!\s*(?:_|do|da|de)\s*e-?mail)\s*[:\-–]\s*(.+)$/i))){out.senha=m[1].trim();return;}
    if(!out.jogo&&(m=s.match(/^jogo\s*:\s*(.+)$/i)))out.jogo=m[1].trim();
    if(!out.console&&/^grupo\s*:/i.test(s)&&(m=s.replace(/>[^<]*<\s*$/,'').match(/[-–]\s*(PS[45])\s*$/i)))out.console=m[1].toUpperCase();
    if(!out.jogo&&(m=s.match(/^grupo\s*:\s*(.+)$/i)))out.jogo=m[1].replace(/>[^<]*<\s*$/,'').replace(/^edi[cç][aã]o\s+\S+\s+(do|da|de)\s+/i,'').replace(/\s*[-–]\s*PS[45](\s*\/\s*PS[45])?\s*$/i,'').trim();
    if(!out.console&&(m=s.match(/^plataforma\s*:\s*(PS[45])\s*$/i)))out.console=m[1].toUpperCase();
  });
  if(!out.email){
    const i=linhas.findIndex(l=>RE_EMAIL.test(l));
    if(i>=0){out.email=linhas[i].match(RE_EMAIL)[0];iEmail=i;
      // "email | senha" ou "email senha" na mesma linha
      const resto=linhas[i].slice(linhas[i].indexOf(out.email)+out.email.length).replace(/^[\s|;,\/–\-]+/,'').trim();
      if(!out.senha&&resto&&!/\s/.test(resto)){out.senha=resto;out.senhaIncerta=true;}
    }
  }
  // Senha sem rótulo logo abaixo do e-mail: sugere, mas marca para conferir.
  if(!out.senha&&iEmail>=0){
    const prox=(linhas.slice(iEmail+1).find(l=>l.trim())||'').trim();
    if(prox&&!/\s/.test(prox)&&!prox.includes('@')&&!prox.includes(':')){out.senha=prox;out.senhaIncerta=true;}
  }
  out.jogo=out.jogo.replace(/[™®]/g,'').replace(/\s{2,}/g,' ').trim();
  return out;
}
$('cola').addEventListener('input',()=>{
  const r=lerColado($('cola').value);

  $('avEmail').textContent=r.email?'':'não achei';

['email','senha'].forEach(id=>$(id).addEventListener('input',()=>{$('av'+id[0].toUpperCase()+id.slice(1)).textContent='';atualizar();}));

  document.querySelectorAll('[data-'+tipo+']').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[tipo]===valor)));

  p.push('licenca='+estado.vaga);
  return TUTORIAL+'?'+p.join('&');
}

function atualizar(){
  if(!estado.textoEditado)$('texto').value=montarTexto();

  $('copEmail').disabled=!$('email').value.trim();
  $('copSenha').disabled=!$('senha').value.trim();

$('texto').addEventListener('input',()=>{estado.textoEditado=true;$('refazer').hidden=false;});

/* ---------- copiar (mesmo jeito do site da loja) ---------- */
async function copiar(text){
  let api=null;
  if(navigator.clipboard&&navigator.clipboard.writeText){try{api=navigator.clipboard.writeText(text);}catch(_){}}
  let ok=false;
  try{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);ok=document.execCommand('copy');ta.remove();}catch(_){}
  if(api){try{await api;return true;}catch(_){}}
  return ok;
}
function status(msg,erro){$('status').textContent=msg;$('status').className=erro?'erro':'';}
function feito(id){$(id).classList.add('feito');}
function ehCelular(){
  const ua=navigator.userAgent||navigator.vendor||'';
  return /android|iphone|ipad|ipod|iemobile|opera mini|mobile/i.test(ua)||(navigator.platform==='MacIntel'&&(navigator.maxTouchPoints||0)>1);
}
function nomeArquivo(){
  const j=($('jogo').value.trim()||'jogo').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60)||'jogo';
  return 'MCO_entrega_'+j+'_'+Date.now().toString(36)+'.jpg';
}
function baixar(blob,nome){
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=nome;a.style.display='none';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>{try{URL.revokeObjectURL(url);}catch(_){}},15000);
}
if(ehCelular())$('dica1').textContent='Abre o compartilhar do celular com a arte e o texto juntos: escolha o WhatsApp e a conversa do cliente.';

$('compartilhar').onclick=async()=>{
  const texto=$('texto').value;
  if(!$('jogo').value.trim()){status('Informe o nome do jogo antes de compartilhar.',true);$('jogo').focus();return;}
  const celular=ehCelular();
  // PC: igual ao site — a cópia do texto começa ainda dentro do clique, antes de qualquer espera.
  const copia=celular?null:copiar(texto);
  const arquivo=new File([await arteParaEnviar()],nomeArquivo(),{type:'image/jpeg'});
  if(celular){
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[arquivo]})){
      try{await navigator.share({files:[arquivo],text:texto,title:'MCO GAMES — seu jogo chegou'});feito('compartilhar');status('Compartilhado. Agora mande o e-mail e a senha.');return;}
      catch(e){if(e&&e.name==='AbortError')return;}
    }
    baixar(arquivo,arquivo.name);status('Arte salva. Abrindo o WhatsApp com o texto…');feito('compartilhar');
    await new Promise(r=>setTimeout(r,900));location.href='https://wa.me/?text='+encodeURIComponent(texto);return;
  }
  baixar(arquivo,arquivo.name);
  const ok=await copia;
  feito('compartilhar');
  status(ok?'Arte baixada e texto copiado. No WhatsApp: arraste a arte para a conversa, cole o texto (Ctrl+V) e envie.':'Arte baixada, mas não consegui copiar o texto: selecione o texto ao lado e copie.',!ok);
};
$('copEmail').onclick=async()=>{const ok=await copiar($('email').value.trim());if(ok)feito('copEmail');status(ok?'E-mail copiado: cole na conversa e envie.':'Não consegui copiar o e-mail.',!ok);};
$('copSenha').onclick=async()=>{const ok=await copiar($('senha').value.trim());if(ok)feito('copSenha');status(ok?'Senha copiada: cole na conversa e envie. Pronto! ✅':'Não consegui copiar a senha.',!ok);};
$('limpar').onclick=()=>{
  ['cola','email','senha','jogo'].forEach(id=>$(id).value='');['avEmail','avSenha'].forEach(id=>$(id).textContent='');
  estado.textoEditado=false;$('refazer').hidden=true;++pedidoCapa;capa.img=null;capa.url='';capa.fonte='';mostrarCapa();redesenhar();
  document.querySelectorAll('.passo').forEach(b=>b.classList.remove('feito'));

};
