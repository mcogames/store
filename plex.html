<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLEX · Assine ou renove</title><meta name="robots" content="noindex">
<style>
:root{--bg:#0b0f17;--card:#121826;--line:#232c3f;--txt:#eef2ff;--mut:#97a3bd;--ac:#e5a00d;--ok:#22c55e;--pur:#b1a7fa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#2a1f05 0,var(--bg) 60%);color:var(--txt);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.w{max-width:460px;margin:0 auto;padding:22px 16px 40px}
.logo{display:block;height:34px;margin:4px auto 18px}
h1{font-size:22px;margin:0 0 4px;text-align:center}.sub{color:var(--mut);text-align:center;margin:0 0 18px}
.venc{display:inline-block;background:#2a1f05;color:var(--ac);border:1px solid #5a4210;border-radius:99px;padding:2px 10px;font-weight:700;font-size:13px}
.plano{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 14px;margin:10px 0;cursor:pointer;transition:.15s}
.plano:hover{border-color:#3a4660}.plano.sel{border-color:var(--ac);box-shadow:0 0 0 3px rgba(229,160,13,.18)}
.radio{flex:0 0 20px;height:20px;border-radius:50%;border:2px solid #44506a}.sel .radio{border:6px solid var(--ac)}
.pn{font-weight:800;font-size:16px}.pe{color:var(--ok);font-size:13px;font-weight:700}.pm{color:var(--mut);font-size:12px}
.pv{margin-left:auto;text-align:right}.pv b{font-size:19px}.pv small{display:block;color:var(--mut);font-size:11px}
.tag{position:absolute;top:-9px;right:14px;background:var(--ac);color:#1a1200;font-size:11px;font-weight:900;border-radius:99px;padding:2px 9px;letter-spacing:.03em}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
button.pay{border:0;border-radius:14px;padding:15px 10px;font-weight:900;font-size:16px;cursor:pointer;color:#06130a;background:var(--ok)}
button.pay.card{background:#e8ecf7;color:#0b0f17}button.pay:disabled{opacity:.5;cursor:wait}
.nota{color:var(--mut);font-size:12.5px;text-align:center;margin-top:12px}
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;text-align:center}
.wa{display:block;margin-top:16px;text-align:center;color:var(--mut);font-size:13px}
.seg{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-size:12px;margin-top:22px}
/* 2M.3.24 — Página padrão de assinatura/renovação + campanhas (plex.html?renovar) */
.bf{display:block;width:max-content;margin:0 auto 10px;background:var(--bf,#c4102e);color:var(--bft,#fff);font-weight:900;letter-spacing:.08em;border-radius:8px;padding:6px 14px;font-size:14px;box-shadow:0 6px 18px rgba(196,16,46,.35)}
.ate{display:block;text-align:center;color:#ffca3a;font-weight:800;margin:-8px 0 14px}
.pv s{display:block;color:var(--mut);font-size:12px}
.mini{display:inline-block;margin-left:6px;background:var(--bf,#c4102e);color:var(--bft,#fff);font-size:10px;font-weight:900;border-radius:6px;padding:1px 6px;vertical-align:2px}
.campo{display:block;margin-top:12px}.campo span{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.campo input{width:100%;background:#0b0f17;color:var(--txt);border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit}
.campo input:focus{outline:none;border-color:var(--ac)}
button.go{width:100%;margin-top:16px;border:0;border-radius:14px;padding:15px;font-weight:900;font-size:16px;cursor:pointer;background:var(--ac);color:#1a1200}
button.go:disabled{opacity:.5;cursor:wait}
</style></head><body><div class="w">

<div id="app"><p class="sub">Carregando sua renovação…</p></div>
<div class="seg">🔒 Pagamento processado pela InfinitePay</div>
</div>
<script>
const PLEX_API = 'https://script.google.com/macros/s/AKfycbx3pGnkWH4o00lW3gR8poQbHtSTkjqAXt7h8DTfaHUhkuQ3guZNmqenk9wUCdORn__E/exec';
const WHATS = '5599981810222';
const $ = s => document.querySelector(s);
const brl = v => 'R$ ' + Number(v).toFixed(2).replace('.', ',');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let dados = null, escolhido = null;
// "vence"/"venceu" pela data de HOJE (dd/mm/aaaa, dia civil, sem fuso).
function diasAte(dmy){const m=String(dmy||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(!m)return null;const h=new Date();
  return Math.round((Date.UTC(+m[3],m[2]-1,+m[1])-Date.UTC(h.getFullYear(),h.getMonth(),h.getDate()))/864e5);}
function fraseVenc(v){const n=diasAte(v);if(n===null)return '';const dm=esc(String(v).slice(0,5));
  if(n>1)return 'Sua assinatura vence em <span class="venc">'+dm+'</span><br>';
  if(n===1)return 'Sua assinatura vence <span class="venc">amanhã</span><br>';
  if(n===0)return 'Sua assinatura vence <span class="venc">hoje</span><br>';
  return 'Sua assinatura venceu em <span class="venc">'+dm+'</span> ('+(n===-1?'ontem':'há '+(-n)+' dias')+')<br>';}
async function api(q){
  if (window.__MOCK) return window.__MOCK(q);
  const r = await fetch(PLEX_API + '?' + new URLSearchParams(q), {credentials:'omit'});
  return r.json();
}
const TEMAS = {black:['#c4102e','#fff','🎬'], natal:['#1f8a4c','#fff','🎄'], padrao:['#e5a00d','#1a1200','🎬']};
function tema(t){const c=TEMAS[t]||TEMAS.padrao;document.documentElement.style.setProperty('--bf',c[0]);document.documentElement.style.setProperty('--bft',c[1]);return c[2];}
let CAMP = null; try{ CAMP = JSON.parse(sessionStorage.getItem('plexCamp')||'null'); }catch(_){}
function render(){
  const d = dados, rot = d.novo&&d.oferta ? String(CAMP&&CAMP.titulo||'Promoção').toUpperCase() : '', emo = tema(CAMP&&CAMP.tema);
  const melhor = d.planos.reduce((a,p)=>p.economia>a.economia?p:a, d.planos[0]);
  $('#app').innerHTML =
    (rot?'<span class="bf">'+esc(rot)+'</span>':'')+
    '<h1>Oi, '+esc(d.nome)+'! '+(d.novo?emo:d.oferta?'🎁':'💙')+'</h1>'+(rot?'<p class="sub" style="color:var(--ac);font-weight:800;margin-bottom:6px">Preço de '+esc(CAMP&&CAMP.titulo||'promoção')+' pra você</p>':d.oferta?'<p class="sub" style="color:var(--ac);font-weight:800;margin-bottom:6px">Oferta especial de renovação pra você</p>':'')+
    '<p class="sub">'+(d.novo?'':fraseVenc(d.vencimento))+'Escolha o plano e pague na hora.</p>'+
    d.planos.map(p=>'<div class="plano'+(escolhido===p.meses?' sel':'')+'" data-m="'+p.meses+'">'+
      (p.meses===melhor.meses&&p.economia>0?'<span class="tag">MAIS ECONÔMICO</span>':'')+
      '<span class="radio"></span><div><div class="pn">'+p.meses+' '+(p.meses===1?'mês':'meses')+'</div>'+
      (p.economia>0?'<div class="pe">Economize '+brl(p.economia)+'</div>':'<div class="pm">Mensal</div>')+
      (p.extra?'<div class="pm">'+esc(p.extra)+'</div>':'')+
      '</div><div class="pv">'+(p.original>p.valor?'<s>'+brl(p.original)+'</s>':'')+'<b>'+brl(p.valor)+'</b>'+(p.meses>1?'<small>'+brl(p.valor/p.meses)+'/mês</small>':'')+'</div></div>').join('')+
    '<div class="btns"><button class="pay" id="bPix" '+(escolhido?'':'disabled')+'>⚡ Pix</button><button class="pay card" id="bCard" '+(escolhido?'':'disabled')+'>💳 Cartão</button></div>'+
    '<div class="nota">'+(escolhido?'Pix: confirmação na hora · Cartão: em até 12x':'Toque em um plano para continuar')+'</div>'+
    (d.validade&&(!d.novo||d.oferta)?'<div class="nota">⏳ '+(d.novo?'Promoção válida até ':'Link válido até ')+esc(d.validade)+'</div>':'')+
    (WHATS?'<a class="wa" href="https://wa.me/'+WHATS+'">Prefiro falar no WhatsApp</a>':'');
  document.querySelectorAll('.plano').forEach(el=>el.onclick=()=>{escolhido=Number(el.dataset.m);render();});
  if (escolhido){ $('#bPix').onclick=()=>pagar('pix'); $('#bCard').onclick=()=>pagar('cartao'); }
}
async function pagar(metodo){
  document.querySelectorAll('button.pay').forEach(b=>b.disabled=true);
  $('.nota').innerText='Gerando seu link seguro…';
  try{
    const r = await api({acao:'plexlink', t:TOKEN, meses:escolhido, metodo});
    if(!r||!r.ok||!/^https:\/\//.test(r.url||''))throw Error((r&&r.erro)||'Não foi possível gerar o link.');
    try{ if(dados&&dados.novo) sessionStorage.setItem('plexNovo', TOKEN); }catch(_){}
    location.href = r.url;
  }catch(e){ $('.nota').innerText = String(e.message||e) + ' Tente de novo ou fale com a gente.'; document.querySelectorAll('button.pay').forEach(b=>b.disabled=false); }
}
const P = new URLSearchParams(location.search), TOKEN = P.get('c')||'';
/* 2M.3.24 — Página padrão do PLEX (plex.html, ?renovar, ?assinar, ?black): mostra todos os planos; os da campanha
   no ar (Black Friday, Natal...) aparecem com o preço riscado. Pede nome e WhatsApp e cria um link pessoal (o preço vem
   do servidor). Depois segue o fluxo normal de escolha do plano e pagamento. */
async function publica(){
  const r = await api({acao:'plexplanos'});
  if(!r||!r.ok)throw Error((r&&r.erro)||'Não foi possível carregar os planos.');
  const c = r.campanha, emo = tema(c&&c.tema);
  document.title = 'PLEX · ' + (c ? c.titulo : 'Assine ou renove');
  try{ sessionStorage.setItem('plexCamp', JSON.stringify(c?{titulo:c.titulo,tema:c.tema}:null)); }catch(_){}
  if(!r.ativa){ $('#app').innerHTML='<h1>Assinatura pelo site pausada</h1><div class="msg">Fale com a gente pelo WhatsApp que a gente resolve na hora. 💙</div>'+(WHATS?'<a class="wa" href="https://wa.me/'+WHATS+'">Falar no WhatsApp</a>':''); return; }
  $('#app').innerHTML = (c?'<span class="bf">'+esc(String(c.titulo).toUpperCase())+'</span><h1>PLEX com preço de '+esc(c.titulo)+' '+emo+'</h1><span class="ate">Só até '+esc(c.validade)+'</span>'
      :'<h1>Assine ou renove o PLEX '+emo+'</h1><p class="sub">Informe seus dados, escolha o plano e pague na hora: Pix ou cartão.</p>')+
    r.planos.map(p=>'<div class="plano" style="cursor:default"><div><div class="pn">'+p.meses+' '+(p.meses===1?'mês':'meses')+(p.promo&&c?'<span class="mini">'+esc(String(c.titulo).toUpperCase())+'</span>':'')+'</div>'+
      (p.meses>1?'<div class="pm">'+brl(p.porMes)+'/mês</div>':'<div class="pm">Mensal</div>')+(p.semJuros?'<div class="pm">Até '+p.semJuros+'x sem juros no cartão</div>':'')+'</div>'+
      '<div class="pv">'+(p.promo?'<s>'+brl(p.original)+'</s>':'')+'<b>'+brl(p.valor)+'</b></div></div>').join('')+
    '<label class="campo"><span>Seu nome</span><input id="fNome" autocomplete="name" maxlength="80" placeholder="Nome e sobrenome"></label>'+
    '<label class="campo"><span>Seu WhatsApp com DDD</span><input id="fWhats" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="(00) 90000-0000"></label>'+
    '<button class="go" id="bGo">Continuar e escolher o plano</button>'+
    '<div class="nota">Já é assinante? Use o mesmo WhatsApp do cadastro: a gente renova a sua assinatura.</div>'+
    (WHATS?'<a class="wa" href="https://wa.me/'+WHATS+'">Prefiro falar no WhatsApp</a>':'');
  $('#bGo').onclick = async()=>{
    const nome=$('#fNome').value.trim(), whats=$('#fWhats').value.trim(), nota=document.querySelector('.nota');
    if(nome.length<3){nota.innerText='Informe seu nome.';$('#fNome').focus();return;}
    if(whats.replace(/\D/g,'').length<10){nota.innerText='Informe seu WhatsApp com DDD.';$('#fWhats').focus();return;}
    $('#bGo').disabled=true; nota.innerText='Preparando seus planos…';
    try{
      const n = await api({acao:'plexnovo', nome, whatsapp:whats});
      if(!n||!n.ok||!/^[A-Za-z0-9]{8,24}$/.test(n.token||''))throw Error((n&&n.erro)||'Não foi possível continuar.');
      location.href = location.pathname + '?c=' + encodeURIComponent(n.token);
    }catch(e){ nota.innerText=String(e.message||e); $('#bGo').disabled=false; }
  };
}
(async()=>{
  try{
    if (P.get('pedido')) {
      const q = {acao:'confirmar', pedido:P.get('pedido')};
      ['slug','invoice_slug','transaction_nsu','transaction_id','receipt_url'].forEach(k=>{if(P.get(k))q[k]=P.get(k);});
      const r = await api(q);
      history.replaceState(null,'',location.pathname+(TOKEN?'?c='+encodeURIComponent(TOKEN):''));
      let novo=false; try{ novo = sessionStorage.getItem('plexNovo') === TOKEN; }catch(_){}
      $('#app').innerHTML = r&&r.pago
        ? (novo
          ? '<h1>Pagamento confirmado! 🎉</h1><div class="msg">Recebemos seu pagamento, obrigado!<br>Se você já é assinante, a renovação entra sozinha em alguns minutos. Se é novo, vamos te chamar no WhatsApp com o acesso. 🍿</div>'+(WHATS?'<a class="wa" href="https://wa.me/'+WHATS+'">Falar no WhatsApp agora</a>':'')
          : '<h1>Pagamento confirmado! 🎉</h1><div class="msg">Sua renovação do PLEX foi recebida.<br>Pode continuar assistindo normalmente. 🍿</div>')
        : '<h1>Quase lá…</h1><div class="msg">Ainda não identificamos o pagamento. Se você concluiu, fale com a gente que conferimos na hora.</div>'+(WHATS?'<a class="wa" href="https://wa.me/'+WHATS+'">Falar no WhatsApp</a>':'');
      return;
    }
    if (!TOKEN) { await publica(); return; }
    if(!/^[A-Za-z0-9]{8,24}$/.test(TOKEN))throw Error('Link inválido.');
    const r = await api({acao:'plex', t:TOKEN});
    if(!r||!r.ok)throw Error((r&&r.erro)||'Link inválido.');
    if (r.pago) { $('#app').innerHTML='<h1>Tudo certo, '+esc(r.nome)+'! 💙</h1><div class="msg">Esta renovação já foi paga. Obrigado!<br>Pode continuar assistindo normalmente. 🍿</div>'; return; }
    dados = r; render();
  }catch(e){ $('#app').innerHTML='<h1>Ops!</h1><div class="msg">'+esc(e.message||e)+'<br>Peça um novo link pelo WhatsApp.</div>'; }
})();
</script></body></html>
